# Alembic configuration (tasks C-01 / C-02; see migrations/README.md).
#
# Keep this file ASCII-only: Python's configparser reads it with the *locale*
# encoding, so non-ASCII comments break Windows (GBK) users.
# The connection string is NOT stored here: migrations/env.py reads DATABASE_URL
# from app.config (environment variables / repository root .env), which is why
# this file is safe to commit.
#
# Commands (run from backend/):
#   alembic revision --autogenerate -m "0002 xxx"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current

[alembic]
script_location = %(here)s/../migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S