[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试文件允许 assert 与未使用变量（fixture 参数）
"tests/*" = ["S101", "B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"