# 姓氏郡望与家族迁徙寻根系统 · Nginx 配置
# 目标位置：/etc/nginx/sites-available/surname_app
# 前置：前端已构建到 /srv/surname_app/frontend/dist，后端在 127.0.0.1:8000

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;                      # 三天阶段用公网 IP 直接访问

    charset utf-8;
    client_max_body_size 8m;

    access_log /var/log/nginx/surname_app.access.log;
    error_log  /var/log/nginx/surname_app.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    root /srv/surname_app/frontend/dist;
    index index.html;

    # ---------- 管理接口：先按来源 IP 限制 ----------
    # 把下面两行改成 B 与 C 的实际出口 IP；其余一律拒绝。
    # 后端还会再校验一次 X-Admin-Token，两层都保留。
    location /api/admin/ {
        allow 127.0.0.1;
        allow 203.0.113.10;             # TODO 改成真实 IP，不要直接删掉这条限制
        deny all;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;         # 导入与重建索引耗时较长
    }

    # ---------- 业务接口 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 接口文档只在调试期开放，演示结束后可整段注释掉
    location ~ ^/(docs|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---------- 前端静态资源 ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 单页应用：其余路径交给 React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件与备份文件
    location ~ /\.(?!well-known) {
        deny all;
    }
}