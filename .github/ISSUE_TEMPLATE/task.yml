name: 开发任务卡（对应 tasks.json 中的任务编号）
description: 一个任务 = 一个可验收的交付物。请勿把多个模块塞进同一张卡。
title: "[TASK] "
labels: ["type/feature"]
body:
  - type: markdown
    attributes:
      value: |
        本模板对应方案文档第 8 节的 A/B/C/D/E 任务编号。
        开工前请阅读 `AGENTS.md` 与 `docs/collaboration/tasks.json` 中同编号任务的验收标准。
  - type: input
    id: task_id
    attributes:
      label: 任务编号
      description: 形如 A-01 / B-03 / C-04 / D-02 / E-05
      placeholder: C-04
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: 负责人（主责=对进度、质量、最终交付负责）
      options:
        - A 产品与总集成
        - B 文献数据与管线
        - C 后端与数据库
        - D 前端与交互
        - E RAG、部署与测试
    validations:
      required: true
  - type: input
    id: deliverable
    attributes:
      label: 交付物
      description: 写清路径或可访问地址，验收人按此核对
      placeholder: backend/app/api/surnames.py + OpenAPI 文档
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 允许修改的文件范围
      description: 只写本任务目录内的文件，不得跨模块
      placeholder: |
        backend/app/api/surnames.py
        backend/app/services/surname_service.py
        backend/tests/test_surnames.py
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: 验收标准（正常 / 空结果 / 异常 / 数据真实性）
      value: |
        - 正常：
        - 空结果：
        - 异常：
        - 数据真实性：
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: 依赖与阻塞
      description: 依赖哪个任务或哪份数据；被阻塞时立即贴到看板并 @ 负责人
      placeholder: 依赖 C-03 导入脚本完成（否则无法验证查询结果）
    validations:
      required: false
  - type: checkboxes
    id: rules
    attributes:
      label: 铁律确认
      options:
        - label: 本任务不编造古籍、卷次、年代、原文或地点
          required: true
        - label: 前端任务不直接调用模型 API；密钥只走环境变量
          required: true
        - label: 新功能将附运行方式与验收结果
          required: true