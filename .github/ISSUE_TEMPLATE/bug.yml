name: 缺陷报告
description: 页面、接口、数据或部署上的可复现问题
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 前端页面与交互
        - 后端接口
        - 数据库与迁移
        - 数据内容与来源
        - RAG 问答
        - 部署与访问
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开搜索页
        2. 输入「欧阳」
        3. 观察到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 优先级
      options:
        - P0 阻塞演示 / 数据错误
        - P1 影响主流程
        - P2 体验问题
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据（截图、接口返回、日志）
      description: 接口类问题请附请求 URL 与返回 JSON
    validations:
      required: false